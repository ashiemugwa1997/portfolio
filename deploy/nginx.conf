# nginx in front of the portfolio server. Certificates from certbot:
#   sudo certbot certonly --nginx -d portfolio.example.com
# A request limit here is shared by every copy of the server behind it.
limit_req_zone $binary_remote_addr zone=portfolio:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name portfolio.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portfolio.example.com;

    ssl_certificate     /etc/letsencrypt/live/portfolio.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 32k;
    client_header_timeout 10s;
    client_body_timeout 10s;

    location / {
        limit_req zone=portfolio burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # overwrite whatever the client sent; the server reads the last entry
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }
}
