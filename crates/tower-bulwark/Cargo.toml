[package]
name = "tower-bulwark"
version = "0.1.0"
description = "Tower layer for safer web services: strict security headers, same-origin writes (CSRF), trusted-proxy client IP, per-IP rate limiting and pluggable request rules."
readme = "README.md"
keywords = ["tower", "security", "csrf", "headers", "axum"]
categories = ["web-programming::http-server", "network-programming"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["rate-limit"]
rate-limit = ["dep:windowgate"]

[dependencies]
http = "1.1"
pin-project-lite = "0.2"
tower-layer = "0.3"
tower-service = "0.3"
windowgate = { path = "../windowgate", version = "0.1", optional = true }

[dev-dependencies]
tokio = { version = "1.41", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
proptest = { version = "1.5", default-features = false, features = ["std"] }
